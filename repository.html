<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Membership Operations Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: demo strip, white brand header, tab bar, then one page at a time (report or repository). */
:root {
  --bg: #F3F6F9;
  --surface: #FFFFFF;
  --ink: #14202B;
  --ink-2: #4A5A68;
  --line: #D3DCE4;
  --line-strong: #7F93A4;
  --accent: #005931;
  --on-accent: #FFFFFF;
  --accent-soft: #E3F0E9;
  --gold: #D3AE49;
  --gold-soft: #FAF2DC;
  --gold-ink: #7A5A00;
  --danger: #B3261E;
  --demo-bg: #14202B;
  --demo-fg: #E6EDF3;
  --demo-line: #3A4A58;
  --head: #F0F4F7;
  --font-body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171E; --surface: #17222C; --ink: #E6EDF3; --ink-2: #9FB0BF; --line: #2A3946; --line-strong: #6B8093;
    --accent: #5FC08F; --on-accent: #07160E; --accent-soft: #12372A; --gold-soft: #3A2F0E; --gold-ink: #E8C566; --danger: #FF9A92;
    --demo-bg: #0A1015; --demo-line: #2A3946; --head: #1B2733; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171E; --surface: #17222C; --ink: #E6EDF3; --ink-2: #9FB0BF; --line: #2A3946; --line-strong: #6B8093;
  --accent: #5FC08F; --on-accent: #07160E; --accent-soft: #12372A; --gold-soft: #3A2F0E; --gold-ink: #E8C566; --danger: #FF9A92;
  --demo-bg: #0A1015; --demo-line: #2A3946; --head: #1B2733; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0;
  padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.bleed { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1100px; margin: 0 auto; }

.demo { background: var(--demo-bg); color: var(--demo-fg); padding-block: 10px; }
.demo .inner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.demo-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
.demo-label b { color: #F2B65A; font-weight: 500; }
.dbtn { background: transparent; border: 1px solid var(--demo-line); color: var(--demo-fg); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.dbtn:hover { border-color: var(--demo-fg); }
.site-head { background: #FFFFFF; border-bottom: 4px solid var(--gold); padding-block: 14px; }
.site-head img { display: block; height: 48px; width: auto; }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 14px 11px; font-weight: 500; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab:focus-visible, .btn:focus-visible, select:focus-visible, .sub:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabs .ext { margin-left: auto; display: flex; gap: 16px; flex-wrap: wrap; }
.tabs a { color: var(--accent); font-size: 14px; }

main { padding-top: 32px; display: flex; flex-direction: column; gap: 36px; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; }
.page-head { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.1; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
h2::after { content: ""; display: block; width: 40px; height: 3px; background: var(--gold); margin-top: 8px; border-radius: 2px; }
.lede { color: var(--ink-2); max-width: 70ch; font-size: 16px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fine { font-size: 13.5px; color: var(--ink-2); }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 10px 14px; background: var(--head); border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.mono, .mono { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
tr.grp td { background: var(--gold-soft); }
tr.dim td { color: var(--ink-2); }
.tier { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.tier.h { background: var(--accent); color: var(--on-accent); }
.tier.i { border: 1.5px solid var(--gold); color: var(--gold-ink); background: var(--gold-soft); }
.gp { white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; color: var(--gold-ink); background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 6px; padding: 1px 7px; }
.badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 1px 10px; border-radius: 6px; white-space: nowrap; }
.badge.new { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--gold-soft); color: var(--gold-ink); }
.badge.mute { background: var(--head); color: var(--ink-2); }
.badge.bad { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.people { margin: 0; padding: 0; list-style: none; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.people span { color: var(--ink-2); }
select { width: 100%; min-height: 44px; padding: 8px 10px; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px; font: inherit; color: inherit; }
label { font-weight: 500; font-size: 14px; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; min-height: 46px; padding: 10px 20px; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li { padding-left: 18px; position: relative; color: var(--ink-2); }
.notes li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 8px; height: 2px; background: var(--gold); }
.notes b { color: var(--ink); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 120px; }
.stat b { font-size: 24px; line-height: 1.1; font-weight: 700; }
.stat span { font-size: 13px; color: var(--ink-2); }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* spreadsheet look for the repository */
.sheetbar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 10px 14px; }
.sheetbar .ic { width: 22px; height: 26px; background: var(--accent); border-radius: 3px; flex: none; position: relative; }
.sheetbar .ic::after { content: ""; position: absolute; inset: 6px 4px; background: repeating-linear-gradient(#fff 0 2px, transparent 2px 5px); opacity: .9; }
.sheetbar b { font-weight: 600; }
.sheetbar span { color: var(--ink-2); font-size: 13px; }
.sheet { border: 1px solid var(--line); background: var(--surface); overflow-x: auto; }
.sheet table { font-size: 13px; }
.sheet th, .sheet td { border-right: 1px solid var(--line); }
.sheet th:last-child, .sheet td:last-child { border-right: 0; }
.sheet td.rn, .sheet th.rn { background: var(--head); color: var(--ink-2); text-align: center; width: 38px; padding-inline: 8px; font-family: var(--font-mono); font-size: 12px; }
.tabsx { display: flex; flex-wrap: wrap; gap: 2px; background: var(--head); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; padding: 6px 8px; }
.sub { background: transparent; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.sub[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 0 0 1px var(--line-strong); }
</style>

<div class="demo bleed"><div class="inner">
  <span class="demo-label"><b>DEMO</b> · fake people and data, nothing is sent</span>
  <button type="button" class="dbtn" id="reset">Reset demo</button>
</div></div>

      if (!g.choice) { out.push({ id: r.id, name: r.first + ' ' + r.last, email: r.email, tier: r.tier, note: 'Group ' + r.group + ' undecided', first: r.first, blocked: true }); return; }
      if (g.choice === 'combine') {
        if (mem[0].id === r.id) {
          var others = mem.slice(1).map(function (m) { return m.first + ' ' + m.last; }).join(', ');
          out.push({ id: r.id, name: r.first + ' ' + r.last, email: r.email, tier: 'Household', note: 'Primary. Group ' + r.group + ' combined, includes ' + others, first: r.first, blocked: false });
        }
        return;
      }
      if (g.choice === 'individuals') { out.push({ id: r.id, name: r.first + ' ' + r.last, email: r.email, tier: 'Individual', note: 'Group ' + r.group + ' kept separate', first: r.first, blocked: false }); }
    });
    return out;
  }
  function classify(row) {
    var ex = EXISTING_INVITES.filter(function (e) { return e.uid === row.id; })[0];
    if (!ex) return { kind: 'new', label: 'New invitation' };
    if (ex.status === 'Active') return { kind: 'mute', label: 'Skipped, already invited' };
    if (ex.status === 'Expired') return { kind: 'warn', label: 'Re-invite, link expired' };
    if (ex.status === 'Used' && ex.tier === 'Individual' && row.tier === 'Household') return { kind: 'warn', label: 'Upgrade, household link' };
    return { kind: 'mute', label: 'Skipped, already registered' };
  }
  function tok(id) {
    var h = 7, s = id + 'al-salam', i;
    for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h.toString(36).toUpperCase().padStart(7, '0').slice(0, 7);
  }
  function doImport() {
    var rows = scrubbed().map(function (r) { var c = classify(r); return { row: r, cls: c }; });
    var send = rows.filter(function (x) { return x.cls.kind === 'new' || x.cls.kind === 'warn'; });
    S.imported = { rows: rows, send: send };
    S.showExport = false;
    S.tab = 'repo';
    S.sheet = 'invites';
  }
  function tierChip(t) { return '<span class="tier ' + (t === 'Household' ? 'h' : 'i') + '">' + esc(t) + '</span>'; }

  // ---------- Report page ----------
  function renderReport() {
    var rows = REPORT.map(function (r, i) {
      return '<tr' + (r.group ? ' class="grp"' : '') + '><td class="mono">' + r.id + '</td><td>' + esc(r.first) + '</td><td>' + esc(r.last) + '</td><td>' + esc(r.addr) +
        '</td><td>' + esc(r.email) + '</td><td>' + tierChip(r.tier) + '</td><td>' + (r.group ? '<span class="gp">' + r.group + '</span>' : '') + '</td></tr>';
    }).join('');
    var cards = Object.keys(S.groups).map(function (g) {
      var mem = groupMembers(g), st = S.groups[g];
      var opts = '<option value="">Choose…</option>' + GROUP_OPTIONS.map(function (o) { return '<option value="' + o.v + '"' + (st.choice === o.v ? ' selected' : '') + '>' + o.t + '</option>'; }).join('');
      return '<div class="card"><h3><span><span class="gp">' + g + '</span> ' + esc(mem[0].addr.split(',')[0]) + '</span>' +
        (st.choice ? '<span class="badge new">Decided</span>' : '<span class="badge warn">Needs a decision</span>') + '</h3>' +
        '<p class="fine">' + esc(st.note) + '</p>' +
        '<ul class="people">' + mem.map(function (m) { return '<li>' + esc(m.first + ' ' + m.last) + ' <span>· ' + esc(m.email) + '</span></li>'; }).join('') + '</ul>' +
        '<label for="sel-' + g + '">Committee decision</label><select id="sel-' + g + '" data-group="' + g + '">' + opts + '</select></div>';
    }).join('');
    var sc = scrubbed();
    var scRows = sc.map(function (r) {
      return '<tr><td class="mono">' + r.id + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.email) + '</td><td>' + tierChip(r.tier) + '</td><td>' +
        (r.blocked ? '<span class="badge bad">Blocked</span> ' : '') + esc(r.note) + '</td></tr>';
    }).join('');
    var un = unresolved();
    return '<div class="page-head"><span class="chip">Mock · QuickBooks export</span><h1>Monthly report</h1>' +
      '<p class="lede">The treasurer\'s November 30 pull, the last of the giving year. Matching uses the address exactly as entered. Every row shows only the tier, never a donation amount.</p></div>' +
      '<section><h2>1. Treasurer\'s report</h2><div class="tbl"><table><thead><tr><th>Unique ID</th><th>First name</th><th>Last name</th><th>Address</th><th>Email address</th><th>Household or Individual</th><th>Group</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<ul class="notes"><li><b>Shaded rows share an address</b> and carry a group number, because together they reach a tier. The committee decides in the next step.</li>' +
      '<li><b>The Qureshi addresses differ by one word</b> ("Court" and "Ct"). The exact-match rule leaves them as two records. The committee can link them by hand.</li>' +
      '<li><b>Three people are already in the repository.</b> They are handled when the list is loaded.</li></ul></section>' +
      '<section><h2>2. Committee scrub</h2><p class="fine">Each group needs a decision before anything is sent.</p><div class="cards">' + cards + '</div></section>' +
      '<section><h2>3. Scrubbed list</h2><div class="tbl"><table><thead><tr><th>Unique ID</th><th>Invitation goes to</th><th>Email</th><th>Tier</th><th>Note</th></tr></thead><tbody>' + scRows + '</tbody></table></div>' +
      '<div class="actions"><button class="btn" id="import"' + (un.length ? ' disabled' : '') + '>Load scrubbed list into the repository</button>' +
      (un.length ? '<span class="fine">Decide ' + un.join(', ') + ' first.</span>' : '<span class="fine">Opens the repository with the import results.</span>') + '</div></section>';
  }

  // ---------- Repository page ----------
  function sheetTable(heads, rows) {
    return '<div class="sheet"><table><thead><tr><th class="rn"></th>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r, i) { return '<tr><td class="rn">' + (i + 1) + '</td>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function statusBadge(s) {
    var k = s === 'Used' || s === 'Registered' ? 'new' : (s === 'Active' || s === 'Ready to send') ? 'warn' : s === 'Expired' ? 'bad' : 'mute';
    return '<span class="badge ' + k + '">' + esc(s) + '</span>';
  }
  function sheetBody() {
    var s = S.sheet;
    if (s === 'people') {
      return sheetTable(['Person ID', 'Name', 'Role', 'Household', 'Email', 'Age range', 'Member', 'Status', 'Registered'],
        PEOPLE.map(function (p) { return [p[0], esc(p[1]), p[2], p[3], esc(p[4] || '—'), p[5] || '—', p[6] === 'Yes' ? '<span class="badge new">Yes</span>' : '<span class="badge mute">No</span>', statusBadge(p[7] === 'Registered' ? 'Registered' : p[7]), p[8]]; }));
    }
    if (s === 'households') {
      return sheetTable(['Household', 'Primary', 'Address', 'Tier', 'Members', 'Saved, not members', 'Status'],
        HOUSEHOLDS.map(function (h) { return [h[0], esc(h[1]), esc(h[2]), tierChip(h[3]), h[4], h[5], h[6]]; }));
    }
    if (s === 'invites') {
      var rows = EXISTING_INVITES.map(function (e) { return [e.inv, esc(e.name), esc(e.email), tierChip(e.tier), e.sent, statusBadge(e.status), e.expires, e.reminder, '<span class="mono">R-' + tok(e.uid + e.inv) + '</span>']; });
      if (S.imported) S.imported.send.forEach(function (x, i) {
        rows.push(['I-' + String(5 + i).padStart(3, '0'), esc(x.row.name), esc(x.row.email), tierChip(x.row.tier), 'Not sent yet', statusBadge('Ready to send'), 'Dec 10, 2026', '—', '<span class="mono">R-' + tok(x.row.id + 'new') + '</span>']);
      });
      return sheetTable(['Invitation', 'Name', 'Email', 'Tier', 'Sent', 'Link status', 'Expires', 'Reminder', 'Link ID'], rows);
    }
    if (s === 'conflicts') {
      var c = [];
      un = unresolved();
      un.forEach(function (g) { c.push(['Open', 'Group ' + g + ' has no committee decision', 'Blocks the import for these records']); });
      EXISTING_INVITES.forEach(function (e) { if (e.status === 'Expired') c.push([S.imported && S.imported.send.some(function (x) { return x.row.id === e.uid; }) ? 'Handled' : 'Open', 'Invitation expired unused: ' + e.name, 'Re-invited in the next send']); });
      PEOPLE.forEach(function (p) { if (p[6] === 'No') c.push(['Info', 'Child saved, not a member: ' + p[1] + ' (' + p[3] + ')', 'Under 18 on Dec 1. Not emailed.']); });
      return sheetTable(['Status', 'Flag', 'Detail'], c.map(function (r) { return [statusBadge(r[0] === 'Open' ? 'Active' : r[0] === 'Handled' ? 'Used' : 'Info').replace(/>[^<]*</, '>' + r[0] + '<'), esc(r[1]), esc(r[2])]; }));
    }
    var log = CHANGELOG_BASE.slice();
    if (S.imported) log.unshift(['Nov 30, 2026 17:20', 'System', 'Import', 'Scrubbed list', S.imported.send.length + ' invitations created, ' + (S.imported.rows.length - S.imported.send.length) + ' skipped']);
    return sheetTable(['When', 'Who', 'Record', 'Field', 'Change'], log.map(function (r) { return r.map(esc); }));
  }
  var un;
  function renderRepo() {
    var im = S.imported, panel;
    if (!im) {
      panel = '<div class="empty"><h2>Nothing imported yet</h2><p class="fine">Resolve the groups on the monthly report, then load the scrubbed list. The repository then compares it with who has already been invited.</p><button class="btn ghost" data-tab="report">Go to the monthly report</button></div>';
    } else {
      var cnt = function (k) { return im.rows.filter(function (x) { return x.cls.kind === k; }).length; };
      var up = im.rows.filter(function (x) { return x.cls.label.indexOf('Upgrade') === 0; }).length;
      var re = im.rows.filter(function (x) { return x.cls.label.indexOf('Re-invite') === 0; }).length;
      var newc = im.rows.filter(function (x) { return x.cls.kind === 'new'; }).length;
      var sk = im.rows.length - im.send.length;
      var list = im.rows.map(function (x) {
        return '<tr' + (x.cls.kind === 'mute' ? ' class="dim"' : '') + '><td class="mono">' + x.row.id + '</td><td>' + esc(x.row.name) + '</td><td>' + tierChip(x.row.tier) + '</td><td><span class="badge ' + x.cls.kind + '">' + x.cls.label + '</span></td></tr>';
      }).join('');
      var exp = '';
      if (S.showExport) {
        exp = '<div class="tbl"><table><thead><tr><th>Email</th><th>First name</th><th>Tier</th><th>Link</th><th>Expires</th></tr></thead><tbody>' +
          im.send.map(function (x) { return '<tr><td>' + esc(x.row.email) + '</td><td>' + esc(x.row.first) + '</td><td>' + tierChip(x.row.tier) + '</td><td class="mono">register.example.org/r/' + tok(x.row.id + 'new') + '</td><td>Dec 10, 2026</td></tr>'; }).join('') +
          '</tbody></table></div><p class="fine">Preview of the file for Mailchimp. Only the primary receives an invitation, and no donation amount is included.</p>';
      }
      panel = '<div class="stats"><div class="stat"><b>' + newc + '</b><span>new invitations</span></div><div class="stat"><b>' + re + '</b><span>re-invited</span></div><div class="stat"><b>' + up + '</b><span>upgraded to household</span></div><div class="stat"><b>' + sk + '</b><span>skipped</span></div></div>' +
        '<div class="tbl"><table><thead><tr><th>Unique ID</th><th>Name</th><th>Tier</th><th>Result</th></tr></thead><tbody>' + list + '</tbody></table></div>' +
        '<div class="actions"><button class="btn" id="export">' + (S.showExport ? 'Hide the Mailchimp file' : 'Export file for Mailchimp') + '</button><span class="fine">Links are one use. Each expires on submit, after 60 days, or on Dec 10, whichever is first.</span></div>' + exp;
    }
    var tabs = [['people', 'People'], ['households', 'Households'], ['invites', 'Invitations'], ['conflicts', 'Conflicts'], ['log', 'Change log']];
    return '<div class="page-head"><span class="chip">Mock · Google Sheet</span><h1>Central repository</h1>' +
      '<p class="lede">One place that tracks who was invited, issues the one-time links and stores each registration. Shown as a Google Sheet for now.</p></div>' +
      '<section><h2>Import from the monthly report</h2>' + panel + '</section>' +
      '<section><h2>The sheet</h2><div><div class="sheetbar"><span class="ic" aria-hidden="true"></span><div><b>Al Salam membership repository</b><br><span>Shared with committee admins only · fake data</span></div></div>' +
      sheetBody() +
      '<div class="tabsx" role="tablist">' + tabs.map(function (t) { return '<button class="sub" role="tab" data-sheet="' + t[0] + '" aria-selected="' + (S.sheet === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div></div>' +
      '<p class="fine">Children saved as not a member (such as Zara Chowdhury) are kept with their household but never emailed.</p></section>';
  }

  // ---------- Wiring ----------
  var view = document.getElementById('view');
  function render() {
    document.getElementById('t-report').setAttribute('aria-selected', String(S.tab === 'report'));
    document.getElementById('t-repo').setAttribute('aria-selected', String(S.tab === 'repo'));
    view.innerHTML = S.tab === 'report' ? renderReport() : renderRepo();
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); }
    else if (t.dataset.sheet) { S.sheet = t.dataset.sheet; render(); }
    else if (t.id === 'import') { doImport(); render(); window.scrollTo({ top: 0 }); }
    else if (t.id === 'export') { S.showExport = !S.showExport; render(); }
    else if (t.id === 'reset') { S = fresh(); render(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.group) { S.groups[t.dataset.group].choice = t.value; S.imported = null; render(); var again = document.getElementById('sel-' + t.dataset.group); if (again) again.focus(); }
  });
  render();
})();
</script>

</body></html>
