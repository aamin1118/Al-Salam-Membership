
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Membership Registration Forms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim demo control strip above a single centered form card; the same card holds the form, the success state and the expired-link state. */
:root {
  --bg: #F3F6F9;
  --surface: #FFFFFF;
  --ink: #14202B;
  --ink-2: #4A5A68;
  --line: #D3DCE4;
  --line-strong: #7F93A4;
  --accent: #005931;
  --gold: #D3AE49;
  --on-accent: #FFFFFF;
  --accent-soft: #E3F0E9;
  --human: #8A5000;
  --human-soft: #FBEACB;
  --danger: #B3261E;
  --demo-bg: #14202B;
  --demo-fg: #E6EDF3;
  --demo-line: #3A4A58;
  --font-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --font-body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171E;
    --surface: #17222C;
    --ink: #E6EDF3;
    --ink-2: #9FB0BF;
    --line: #2A3946;
    --line-strong: #6B8093;
    --accent: #5FC08F;
    --on-accent: #07160E;
    --accent-soft: #12372A;
    --human: #EDB963;
    --human-soft: #3A2C12;
    --danger: #FF9A92;
    --demo-bg: #0A1015;
    --demo-fg: #E6EDF3;
    --demo-line: #2A3946;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171E;
  --surface: #17222C;
  --ink: #E6EDF3;
  --ink-2: #9FB0BF;
  --line: #2A3946;
  --line-strong: #6B8093;
  --accent: #5FC08F;
  --on-accent: #07160E;
  --accent-soft: #12372A;
  --human: #EDB963;
  --human-soft: #3A2C12;
  --danger: #FF9A92;
  --demo-bg: #0A1015;
  --demo-fg: #E6EDF3;
  --demo-line: #2A3946;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 0 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }

.demo { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--demo-bg); color: var(--demo-fg); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.demo-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
.demo-label b { color: #F2B65A; font-weight: 500; }
.demo-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--demo-line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; color: var(--demo-fg); border: 0; padding: 7px 14px; font-size: 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--demo-line); }
.seg button[aria-pressed="true"] { background: var(--demo-fg); color: var(--demo-bg); font-weight: 600; }
.dbtn { background: transparent; border: 1px solid var(--demo-line); color: var(--demo-fg); border-radius: 8px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
.dbtn:hover { border-color: var(--demo-fg); }
.demo button:focus-visible { outline: 2px solid #F2B65A; outline-offset: 2px; }

main { max-width: 760px; margin: 0 auto; padding-top: 32px; display: flex; flex-direction: column; gap: 24px; }
.site-head { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: #FFFFFF; border-bottom: 4px solid var(--gold); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-head-in { max-width: 760px; margin: 0 auto; }
.site-head img { display: block; height: 48px; width: auto; }

.head { display: flex; flex-direction: column; gap: 12px; }
.chip { align-self: flex-start; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.05; font-weight: 700; }
.lede { color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.invite { font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.invite b { color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 14px; padding: clamp(20px, 4vw, 36px); display: flex; flex-direction: column; gap: 32px; }
.blk { display: flex; flex-direction: column; gap: 16px; }
.blk + .blk { border-top: 1px solid var(--line); padding-top: 28px; }
h2 { font-size: 21px; font-weight: 600; }
h2::after { content: ""; display: block; width: 40px; height: 3px; background: var(--gold); margin-top: 8px; border-radius: 2px; }
.sub { color: var(--ink-2); font-size: 14.5px; margin-top: -8px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1.5fr 0.6fr 0.9fr; gap: 16px; }
@media (max-width: 560px) { .grid, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
label { font-weight: 500; font-size: 14.5px; }
.opt { font-weight: 400; color: var(--ink-2); font-size: 13px; margin-left: 4px; }
input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select {
  width: 100%; min-height: 46px; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px;
}
input[readonly] { background: var(--bg); color: var(--ink-2); }
input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }
.hint { font-size: 13px; color: var(--ink-2); }
.err { font-size: 13.5px; color: var(--danger); font-weight: 500; }
.err:empty { display: none; }
.chk { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-weight: 400; font-size: 15px; }
.chk input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; min-height: 48px; padding: 12px 22px; font-weight: 600; font-size: 16px; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.small { min-height: 42px; padding: 8px 14px; font-size: 15px; }
.btn:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: 14.5px; }
.fine { font-size: 13.5px; color: var(--ink-2); }

.dep { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
.dep-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dep h3 { font-size: 16px; font-weight: 650; }
.dep input[type="text"], .dep input[type="email"], .dep select { background: var(--surface); }
.deps { display: flex; flex-direction: column; gap: 14px; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--human-soft); color: var(--ink); border: 1px solid var(--human); }
.summary { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.summary h3 { font-size: 16px; }
.summary ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.summary li { display: flex; justify-content: space-between; gap: 12px; }
.summary li span:last-child { color: var(--ink-2); font-family: var(--font-mono); font-size: 12.5px; }
.formerr { background: var(--surface); border: 1.5px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 10px 12px; font-weight: 500; }
.formerr:empty { display: none; }

.done { display: flex; flex-direction: column; gap: 20px; }
.done h1 { font-size: clamp(28px, 5vw, 38px); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 600; font-size: 14px; font-family: var(--font-mono); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.mail { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
</style>

<div class="demo">
  <div class="demo-in">
    <span class="demo-label"><b>DEMO</b> · example data, nothing is sent</span>
    <div class="demo-ctl">
      <div class="seg" role="group" aria-label="Choose form">
        <button type="button" id="tab-household" data-type="household" aria-pressed="true">Household</button>
        <button type="button" id="tab-individual" data-type="individual" aria-pressed="false">Individual</button>
      </div>
      <button type="button" class="dbtn" id="fill">Fill sample</button>
      <button type="button" class="dbtn" id="reset">Reset</button>
    </div>
  </div>
</div>

<main>
  <div id="view"></div>
</main>

<script>
(function () {
  var MEMBER_START = 'December 1, 2026';
  var MEMBER_END = 'November 30, 2027';
  var INVITES = {
    household: { first: 'Asim', last: 'Amin', email: 'aamin@example.org' },
    individual: { first: 'Asim', last: 'Amin', email: 'aamin@example.org' }
  };
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var nextDep = 1;
  var view = document.getElementById('view');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function startType() { return location.hash === '#individual' ? 'individual' : 'household'; }
  function blank(type) {
    var inv = INVITES[type];
    return {
      type: type, mode: 'form',
      primary: { first: inv.first, last: inv.last, email: inv.email, phone: '' },
      addr: { street: '', city: '', state: '', zip: '' },
      hasSpouse: false, spouse: { first: '', last: '', email: '' },
      deps: [], same: false, terms: false, errors: {}
    };
  }
  var S = blank(startType());

  function field(id, label, path, val, o) {
    o = o || {};
    return '<div class="fld' + (o.wide ? ' wide' : '') + '">' +
      '<label for="' + id + '">' + label + (o.optional ? '<span class="opt">optional</span>' : '') + '</label>' +
      '<input id="' + id + '" type="' + (o.type || 'text') + '" value="' + esc(val) + '" data-path="' + path + '"' +
      ' autocomplete="' + (o.auto || 'off') + '"' + (o.ro ? ' readonly' : '') +
      (o.inputmode ? ' inputmode="' + o.inputmode + '"' : '') + (o.max ? ' maxlength="' + o.max + '"' : '') +
      (o.ph ? ' placeholder="' + o.ph + '"' : '') +
      ' aria-describedby="err-' + id + (o.hint ? ' hint-' + id : '') + '">' +
      (o.hint ? '<p class="hint" id="hint-' + id + '">' + o.hint + '</p>' : '') +
      '<p class="err" id="err-' + id + '" role="alert"></p></div>';
  }

  function spouseHTML() {
    if (!S.hasSpouse) return '';
    return '<div class="grid">' +
      field('s-first', 'First name', 'spouse.first', S.spouse.first) +
      field('s-last', 'Last name', 'spouse.last', S.spouse.last) +
      field('s-email', 'Email', 'spouse.email', S.spouse.email, { type: 'email', wide: true, auto: 'off', hint: 'Your spouse gets a confirmation email after you submit.' }) +
      '</div>';
  }

  function depHTML(d, i) {
    var n = d.id, child = d.rel === 'child';
    var age = child
      ? '<div class="fld"><label for="d' + n + '-age">Age on Dec 1, 2026</label>' +
        '<select id="d' + n + '-age" data-path="dep:' + n + ':age" data-rerender="1" aria-describedby="err-d' + n + '-age">' +
        '<option value=""' + (d.age === '' ? ' selected' : '') + '>Select an age range</option>' +
        '<option value="u18"' + (d.age === 'u18' ? ' selected' : '') + '>Under 18</option>' +
        '<option value="18-26"' + (d.age === '18-26' ? ' selected' : '') + '>18 to 26</option>' +
        '<option value="27+"' + (d.age === '27+' ? ' selected' : '') + '>27 or older</option></select>' +
        '<p class="err" id="err-d' + n + '-age" role="alert"></p></div>'
      : '';
    var warn = (child && (d.age === 'u18' || d.age === '27+'))
      ? '<p class="notice">Members must be 18 to 26 on December 1, 2026. We will save this child’s information, but they will not be a member and will not be emailed.</p>'
      : '';
    var par = !child
      ? '<label class="chk"><input type="checkbox" id="d' + n + '-par" data-path="dep:' + n + ':parent"' + (d.parent ? ' checked' : '') + '><span>I confirm this person is my parent.</span></label>' +
        '<p class="err" id="err-d' + n + '-par" role="alert"></p>'
      : '';
    return '<div class="dep"><div class="dep-head"><h3>' + (child ? 'Child' : 'Parent') + ' · household member ' + (i + 1) + '</h3>' +
      '<button type="button" class="link" data-remove="' + n + '">Remove</button></div>' +
      '<div class="grid"><div class="fld"><label for="d' + n + '-rel">Relationship to you</label>' +
      '<select id="d' + n + '-rel" data-path="dep:' + n + ':rel" data-rerender="1">' +
      '<option value="child"' + (child ? ' selected' : '') + '>Child</option>' +
      '<option value="parent"' + (!child ? ' selected' : '') + '>Parent</option></select></div>' + age +
      field('d' + n + '-first', 'First name', 'dep:' + n + ':first', d.first) +
      field('d' + n + '-last', 'Last name', 'dep:' + n + ':last', d.last) +
      field('d' + n + '-email', 'Email', 'dep:' + n + ':email', d.email, { type: 'email', wide: true, optional: nonMember(d), hint: nonMember(d) ? 'Optional. We will not email this child.' : 'Each person needs their own email address.' }) +
      '</div>' + warn + par + '</div>';
  }

  function depsHTML() {
    return S.deps.map(depHTML).join('');
  }

  function renderForm() {
    var hh = S.type === 'household';
    var inv = INVITES[S.type];
    var html =
      '<div class="head"><span class="chip">' + (hh ? 'Household membership' : 'Individual membership') + '</span>' +
      '<h1>' + (hh ? 'Register your household' : 'Register as a member') + '</h1>' +
      '<p class="lede">' + (hh
        ? 'You qualified as a household primary. Add yourself, your spouse and other household members below. Each person needs their own email address.'
        : 'You qualified as an individual member. Confirm your details to complete your registration.') +
      ' Membership runs ' + MEMBER_START + ' to ' + MEMBER_END + '.</p>' +
      '<p class="invite">Invitation sent to <b>' + esc(inv.email) + '</b>. This link works once. It stops working when you submit, 60 days after it was sent, or on December 10, whichever comes first.</p></div>' +
      '<form class="card" id="reg" novalidate>' +
      '<div class="formerr" id="formerr" role="alert"></div>' +
      '<section class="blk"><h2>' + (hh ? 'Your details' : 'Your details') + '</h2><div class="grid">' +
      field('p-first', 'First name', 'primary.first', S.primary.first, { auto: 'given-name' }) +
      field('p-last', 'Last name', 'primary.last', S.primary.last, { auto: 'family-name' }) +
      field('p-email', 'Email', 'primary.email', S.primary.email, { type: 'email', ro: true, wide: true, auto: 'email', hint: 'From your invitation. This is how we identify you.' }) +
      field('p-phone', 'Phone', 'primary.phone', S.primary.phone, { type: 'tel', auto: 'tel', optional: true, wide: true }) +
      '</div></section>' +
      '<section class="blk"><h2>Mailing address</h2>' +
      '<div class="grid">' + field('a-street', 'Street address', 'addr.street', S.addr.street, { wide: true, auto: 'street-address' }) + '</div>' +
      '<div class="grid3">' +
      field('a-city', 'City', 'addr.city', S.addr.city, { auto: 'address-level2' }) +
      field('a-state', 'State', 'addr.state', S.addr.state, { auto: 'address-level1', max: 2, ph: 'IN' }) +
      field('a-zip', 'ZIP code', 'addr.zip', S.addr.zip, { auto: 'postal-code', inputmode: 'numeric', max: 10 }) +
      '</div></section>';

    if (hh) {
      html +=
        '<section class="blk"><h2>Spouse</h2><p class="sub">Optional. Your spouse gets their own confirmation email.</p>' +
        '<label class="chk"><input type="checkbox" id="has-spouse" data-path="hasSpouse"' + (S.hasSpouse ? ' checked' : '') + '><span>I am adding my spouse</span></label>' +
        '<div id="spouse-box">' + spouseHTML() + '</div></section>' +
        '<section class="blk"><h2>Children and parents</h2><p class="sub">Children who are 18 to 26 on December 1, 2026 become members. Other children are saved on your registration, but they are not members and are not emailed. Parents are added on your word, so please only add your own parents.</p>' +
        '<div class="deps" id="deps-box">' + depsHTML() + '</div>' +
        '<div><button type="button" class="btn ghost small" data-add="1">Add a child or parent</button></div></section>' +
        '<section class="blk"><h2>Your household</h2><div class="summary" id="summary"></div>' +
        '<label class="chk"><input type="checkbox" id="same" data-path="same"' + (S.same ? ' checked' : '') + '><span>Everyone listed lives at the address above.</span></label>' +
        '<p class="err" id="err-same" role="alert"></p></section>';
    }

    html +=
      '<section class="blk"><label class="chk"><input type="checkbox" id="terms" data-path="terms"' + (S.terms ? ' checked' : '') + '>' +
      '<span>I confirm the information above is correct and I understand membership runs ' + MEMBER_START + ' to ' + MEMBER_END + '.</span></label>' +
      '<p class="err" id="err-terms" role="alert"></p>' +
      '<div class="actions"><button class="btn" type="submit">Submit registration</button></div>' +
      '<p class="fine">After you submit, this link can no longer be opened.</p></section>' +
      '</form>';

    view.innerHTML = html;
    renderSummary();
    showErrors();
  }

  function nonMember(d) { return d.rel === 'child' && (d.age === 'u18' || d.age === '27+'); }

  function people() {
    var out = [{ name: (S.primary.first + ' ' + S.primary.last).trim() || 'You', role: 'Primary', email: S.primary.email, member: true }];
    if (S.type !== 'household') return out;
    if (S.hasSpouse) out.push({ name: (S.spouse.first + ' ' + S.spouse.last).trim() || 'Spouse', role: 'Spouse', email: S.spouse.email, member: true });
    S.deps.forEach(function (d) {
      out.push({ name: (d.first + ' ' + d.last).trim() || (d.rel === 'child' ? 'Child' : 'Parent'), role: d.rel === 'child' ? 'Child' : 'Parent', email: d.email, member: !nonMember(d) });
    });
    return out;
  }

  function renderSummary() {
    var el = document.getElementById('summary');
    if (!el) return;
    var p = people();
    var m = p.filter(function (x) { return x.member; });
    var o = p.length - m.length;
    el.innerHTML = '<h3>' + m.length + (m.length === 1 ? ' member' : ' members') + ', each with their own email' + (o ? ' · ' + o + ' saved, not a member' : '') + '</h3><ul>' +
      p.map(function (x) { return '<li><span>' + esc(x.name) + '</span><span>' + x.role + (x.member ? '' : ' · not a member') + '</span></li>'; }).join('') + '</ul>';
  }

  function setPath(path, val) {
    if (path.indexOf('dep:') === 0) {
      var parts = path.split(':');
      var d = S.deps.filter(function (x) { return String(x.id) === parts[1]; })[0];
      if (d) d[parts[2]] = val;
      return;
    }
    var keys = path.split('.'), o = S;
    for (var i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = val;
  }

  function clearErr(id) {
    if (!id) return;
    delete S.errors[id];
    var el = document.getElementById('err-' + id);
    if (el) el.textContent = '';
    var inp = document.getElementById(id);
    if (inp) inp.removeAttribute('aria-invalid');
  }

  function showErrors() {
    Object.keys(S.errors).forEach(function (id) {
      var el = document.getElementById('err-' + id);
      if (el) el.textContent = S.errors[id];
      var inp = document.getElementById(id);
      if (inp) inp.setAttribute('aria-invalid', 'true');
    });
  }

  function validate() {
    var e = {}, seen = {};
    function req(id, v, msg) { if (!String(v).trim()) e[id] = msg; }
    function em(id, v, optional) {
      var x = String(v).trim().toLowerCase();
      if (!x && optional) return;
      if (!x) { e[id] = 'Enter an email address.'; return; }
      if (!EMAIL.test(x)) { e[id] = 'Enter a valid email address.'; return; }
      if (seen[x]) { e[id] = 'Another person in this registration already uses this email. Each person needs their own.'; return; }
      seen[x] = 1;
    }
    req('p-first', S.primary.first, 'Enter your first name.');
    req('p-last', S.primary.last, 'Enter your last name.');
    em('p-email', S.primary.email);
    req('a-street', S.addr.street, 'Enter your street address.');
    req('a-city', S.addr.city, 'Enter your city.');
    if (!/^[A-Za-z]{2}$/.test(S.addr.state.trim())) e['a-state'] = 'Use the 2-letter state.';
    if (!/^\d{5}(-\d{4})?$/.test(S.addr.zip.trim())) e['a-zip'] = 'Enter a 5-digit ZIP code.';
    if (S.type === 'household') {
      if (S.hasSpouse) {
        req('s-first', S.spouse.first, 'Enter your spouse’s first name.');
        req('s-last', S.spouse.last, 'Enter your spouse’s last name.');
        em('s-email', S.spouse.email);
      }
      S.deps.forEach(function (d) {
        var n = d.id;
        req('d' + n + '-first', d.first, 'Enter a first name.');
        req('d' + n + '-last', d.last, 'Enter a last name.');
        em('d' + n + '-email', d.email, nonMember(d));
        if (d.rel === 'child') {
          if (!d.age) e['d' + n + '-age'] = 'Select an age range.';
        } else if (!d.parent) {
          e['d' + n + '-par'] = 'Please confirm this person is your parent.';
        }
      });
      if (people().length > 1 && !S.same) e['same'] = 'Please confirm everyone lives at this address.';
    }
    if (!S.terms) e['terms'] = 'Please confirm to continue.';
    return e;
  }

  function submit() {
    S.errors = validate();
    var keys = Object.keys(S.errors);
    var box = document.getElementById('formerr');
    if (keys.length) {
      showErrors();
      box.textContent = 'Please fix ' + keys.length + (keys.length === 1 ? ' item' : ' items') + ' below.';
      var first = null;
      var all = view.querySelectorAll('input, select');
      for (var i = 0; i < all.length; i++) { if (S.errors[all[i].id]) { first = all[i]; break; } }
      if (first) first.focus();
      return;
    }
    S.mode = 'done';
    render();
    window.scrollTo({ top: 0 });
  }

  function renderDone() {
    var p = people();
    var hh = S.type === 'household';
    var first = S.primary.first || 'there';
    var members = p.filter(function (x) { return x.member; });
    var others = p.filter(function (x) { return !x.member; });
    var steps = ['<b>Check your inbox.</b> We emailed a copy of what you submitted to ' + esc(S.primary.email) + '.'];
    if (members.length > 1) steps.push('<b>Everyone else gets their own confirmation.</b> We emailed each member on your registration:<br><span class="mail">' +
      members.slice(1).map(function (x) { return esc(x.email); }).join('<br>') + '</span>');
    if (others.length) steps.push('<b>Saved, but not members.</b> We kept the information for ' +
      others.map(function (x) { return esc(x.name); }).join(', ') + '. They are not members and we did not email them.');
    steps.push('<b>Membership starts ' + MEMBER_START + '.</b> It runs through ' + MEMBER_END + '.');
    view.innerHTML =
      '<div class="card done"><span class="chip">Registration received</span>' +
      '<h1>Thank you, ' + esc(first) + '.</h1>' +
      '<p class="lede">We have saved ' + (hh ? 'your household' : 'your details') + '. Membership starts ' + MEMBER_START + '.</p>' +
      '<ol class="steps">' + steps.map(function (s, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + s + '</span></li>'; }).join('') + '</ol>' +
      '<p class="fine">To change anything, contact the membership committee at memberships@alsalamfoundation.org. This registration link has now been used and cannot be opened again.</p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="again">Try the link again</button>' +
      '<button type="button" class="btn ghost" id="restart">Start over</button></div></div>';
  }

  function renderExpired() {
    view.innerHTML =
      '<div class="card done"><span class="chip">Link not available</span>' +
      '<h1>This link has expired or was already used.</h1>' +
      '<p class="lede">For security, each registration link works once and stops working 60 days after it was sent, or on December 10 at the latest. To change something you submitted, or to ask for a new link, contact the membership committee at memberships@alsalamfoundation.org.</p>' +
      '<div class="actions"><button type="button" class="btn ghost" id="restart">Back to the demo form</button></div></div>';
  }

  function syncTabs() {
    ['household', 'individual'].forEach(function (t) {
      document.getElementById('tab-' + t).setAttribute('aria-pressed', String(S.type === t));
    });
  }

  function render() {
    if (S.mode === 'done') renderDone();
    else if (S.mode === 'expired') renderExpired();
    else renderForm();
    syncTabs();
  }

  function renderDeps() {
    var box = document.getElementById('deps-box');
    if (box) { box.innerHTML = depsHTML(); showErrors(); }
    renderSummary();
  }

  function fillSample() {
    var type = S.type;
    S = blank(type);
    S.addr = { street: '1111 Membership Drive', city: 'Carmel', state: 'IN', zip: '46032' };
    S.primary.phone = '317-555-0142';
    S.terms = true;
    if (type === 'household') {
      S.hasSpouse = true;
      S.spouse = { first: 'Aliya', last: 'Amin', email: 'aliya.amin@example.org' };
      S.deps = [
        { id: nextDep++, rel: 'child', first: 'Shayan', last: 'Amin', email: 'shayan.amin@example.org', age: '18-26', parent: false },
        { id: nextDep++, rel: 'child', first: 'Ayza', last: 'Amin', email: '', age: 'u18', parent: false },
        { id: nextDep++, rel: 'parent', first: 'Yusuf', last: 'Amin', email: 'yusuf.amin@example.org', age: '', parent: true }
      ];
      S.same = true;
    }
    render();
  }

  view.addEventListener('input', onInput);
  view.addEventListener('change', onInput);
  function onInput(ev) {
    var t = ev.target, p = t.dataset ? t.dataset.path : null;
    if (!p) return;
    setPath(p, t.type === 'checkbox' ? t.checked : t.value);
    clearErr(t.id);
    if (p === 'hasSpouse') {
      document.getElementById('spouse-box').innerHTML = spouseHTML();
    }
    if (t.dataset.rerender && ev.type === 'change') {
      var id = t.id;
      renderDeps();
      var again = document.getElementById(id);
      if (again) again.focus();
    }
    renderSummary();
  }

  view.addEventListener('submit', function (ev) { ev.preventDefault(); submit(); });
  view.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.add) {
      S.deps.push({ id: nextDep++, rel: 'child', first: '', last: '', email: '', age: '', parent: false });
      renderDeps();
      var last = S.deps[S.deps.length - 1];
      var f = document.getElementById('d' + last.id + '-rel');
      if (f) f.focus();
    } else if (t.dataset.remove) {
      S.deps = S.deps.filter(function (d) { return String(d.id) !== t.dataset.remove; });
      renderDeps();
    } else if (t.id === 'again') {
      S.mode = 'expired'; render();
    } else if (t.id === 'restart') {
      S = blank(S.type); render();
    }
  });

  document.getElementById('tab-household').addEventListener('click', function () { S = blank('household'); render(); });
  document.getElementById('tab-individual').addEventListener('click', function () { S = blank('individual'); render(); });
  document.getElementById('fill').addEventListener('click', fillSample);
  document.getElementById('reset').addEventListener('click', function () { S = blank(S.type); render(); });

  render();
})();
</script>

</body></html>
